name: pharmed

packages:
  - packages/pharmed_core
  - packages/pharmed_data
  - packages/pharmed_hardware
  - packages/pharmed_ui
  - packages/pharmed_utils
  - apps/pharmed-client
  - apps/pharmed-manager
  - apps/pharmed-hw-test
  - apps/pharmed-widgetbook

scripts:
  get:
    run: melos exec -- flutter pub get
    description: Tüm paketlerde pub get

  analyze:
    run: melos exec -- flutter analyze
    description: Tüm paketlerde analyze

  test:
    run: melos exec -- flutter test
    description: Tüm paketlerde test

  run:client:dev:
    run: flutter run --flavor dev -t apps/pharmed-client/lib/main_dev.dart
    description: pharmed-client dev flavor

  run:manager:dev:
    run: flutter run --flavor dev -t apps/pharmed-manager/lib/main_dev.dart
    description: pharmed-manager dev flavor (Windows)

  run:hw-test:dev:
    run: cd apps/pharmed-hw-test && flutter run -t lib/main_dev.dart -d windows
    description: pharmed-hw-test (donanım test uygulaması) dev ortamı, Windows

  run:hw-test:mac:
    run: cd apps/pharmed-hw-test && flutter run -t lib/main_dev.dart -d macos
    description: pharmed-hw-test macOS'ta (yalnız arayüz kontrolü; seri port/kabin testi yapılamaz)

  catalog:
    run: melos exec --scope="pharmed_widgetbook" -- flutter run -d chrome
    description: Widget kataloğunu tarayıcıda aç (Widgetbook)
sdkPath: .fvm/flutter_sdk

# Windows build — elle tetiklenebilir + release'te otomatik.
#
# Elle: Actions → "Windows Build" → Run workflow → branch / uygulama / flavor / cihaz seç.
# Release: "Publish release" edildiğinde dev flavor ile dört paket üretip release'e ekler:
#   pharmed-client  …-dev-pc     → bilgisayarda test: gerçek API, sahte cihazlar (HARDWARE=mock)
#   pharmed-client  …-dev-kabin  → kabinde test: gerçek API, gerçek cihazlar (HARDWARE=real)
#   pharmed-manager …-dev
#   pharmed-hw-test …-dev        → saha teknisyenleri için donanım test uygulaması

name: Windows Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: Hangi uygulama?
        type: choice
        options: [client, manager, hw-test, both, all]
        default: client
      flavor:
        description: Flavor (lib/main_<flavor>.dart) — hangi backend
        type: choice
        options: [dev, prod, mock]
        default: dev
      hardware:
        description: "Cihazlar (yalnız client): pc = sahte cihaz, kabin = gerçek cihaz, both = ikisi"
        type: choice
        options: [both, pc, kabin]
        default: both
  release:
    types: [published]

concurrency:
  group: windows-build-${{ github.ref }}-${{ inputs.app || 'release' }}-${{ inputs.flavor || 'dev' }}-${{ inputs.hardware || 'both' }}
  cancel-in-progress: true

jobs:
  # Seçime göre build matrisini üretir: her satır bir paket (uygulama + cihaz modu).
  # Client için hardware: mock (pc) / real (kabin); manager'da cihaz yok.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        run: |
          # both = client + manager, all = client + manager + hw-test (release'te all)
          app="${{ inputs.app || 'all' }}"
          hw="${{ inputs.hardware || 'both' }}"
          rows=()
          if [ "$app" = "client" ] || [ "$app" = "both" ] || [ "$app" = "all" ]; then
            [ "$hw" != "kabin" ] && rows+=('{"app":"pharmed-client","hardware":"mock","variant":"pc"}')
            [ "$hw" != "pc" ]    && rows+=('{"app":"pharmed-client","hardware":"real","variant":"kabin"}')
          fi
          if [ "$app" = "manager" ] || [ "$app" = "both" ] || [ "$app" = "all" ]; then
            rows+=('{"app":"pharmed-manager","hardware":"","variant":""}')
          fi
          if [ "$app" = "hw-test" ] || [ "$app" = "all" ]; then
            rows+=('{"app":"pharmed-hw-test","hardware":"","variant":""}')
          fi
          json="[$(IFS=,; echo "${rows[*]}")]"
          echo "include=$json" >> "$GITHUB_OUTPUT"
          echo "Matris: $json"

  build:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.include) }}
    env:
      FLAVOR: ${{ inputs.flavor || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release'te tag'in kodu, elle çalıştırmada "Run workflow"da seçilen branch.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.6
          # IEC 62304 tekrarlanabilirliği için sürümü sabitlemek isterseniz:
          # flutter-version: 3.38.4
          cache: true

      - name: Flutter sürümü
        run: flutter --version

      # pub workspace (resolution: workspace) — kökten tek seferde çözülür.
      - name: Bağımlılıklar (workspace)
        run: flutter pub get

      # *.g.dart / *.freezed.dart .gitignore'da olduğu için repoda YOK;
      # CI'da üretilmezse derleme "part file not found" ile kırılır.
      - name: Kod üretimi (build_runner)
        working-directory: packages/pharmed_data
        run: dart run build_runner build --delete-conflicting-outputs

      # media_kit_libs_windows_video, CMake aşamasında ANGLE.7z ve libmpv arşivlerini
      # GitHub release'lerinden indirip MD5 kontrolü yapar. Bu arşivleri cache'leyerek
      # her build'de yeniden indirmeyi (ve geçici ağ hatalarını) önlüyoruz.
      # actions/cache yalnızca job BAŞARILI biterse kaydeder → bozuk arşiv cache'e giremez.
      # Key pubspec.lock'a bağlı → eklenti sürümü değişince cache otomatik yenilenir.
      - name: Cache media_kit native arşivleri
        if: matrix.app != 'pharmed-hw-test'
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/build/windows/x64/*.7z
          key: media-kit-win-${{ matrix.app }}-${{ hashFiles('**/pubspec.lock') }}

      # Arşivleri CMake'ten ÖNCE kendimiz indirip MD5 doğruluyoruz. CMake dosya
      # zaten varsa ve MD5 tutuyorsa indirmeyi atlar. URL ve MD5'ler, kullanılan
      # eklenti sürümünün kendi CMakeLists.txt'inden okunur → sürüm değişince
      # bu adımı güncellemek gerekmez. curl retry + net hata mesajı (HTTP kodu) verir.
      - name: media_kit arşivlerini önceden indir
        if: matrix.app != 'pharmed-hw-test'
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
        run: |
          $cfg = Get-Content .dart_tool/package_config.json -Raw | ConvertFrom-Json
          $pkg = $cfg.packages | Where-Object name -eq 'media_kit_libs_windows_video'
          if (-not $pkg) { Write-Host 'media_kit_libs_windows_video yok, atlanıyor.'; exit 0 }
          $root = $pkg.rootUri
          if ($root -match '^file:') { $root = ([Uri]$root).LocalPath }
          else { $root = Join-Path (Resolve-Path .dart_tool) $root }
          $cmake = Get-Content (Join-Path $root 'windows/CMakeLists.txt') -Raw
          Write-Host "Eklenti: $root"

          $mpv      = [regex]::Match($cmake, 'set\(LIBMPV "(mpv-dev-x86_64[^"]+)"\)')
          $mpvName  = $mpv.Groups[1].Value
          $mpvMd5   = [regex]::Match($cmake.Substring($mpv.Index), 'set\(LIBMPV_MD5 "([0-9a-fA-F]{32})"\)').Groups[1].Value
          $mpvUrl   = [regex]::Match($cmake, 'set\(LIBMPV_URL "([^"]+)"\)').Groups[1].Value.Replace('${LIBMPV}', $mpvName)
          $angleUrl = [regex]::Match($cmake, 'set\(ANGLE_URL "([^"]+)"\)').Groups[1].Value
          $angleMd5 = [regex]::Match($cmake, 'set\(ANGLE_MD5 "([0-9a-fA-F]{32})"\)').Groups[1].Value
          if (-not ($mpvName -and $mpvMd5 -and $mpvUrl -and $angleUrl -and $angleMd5)) {
            throw 'CMakeLists.txt ayrıştırılamadı (eklenti yapısı değişmiş olabilir).'
          }

          $dir = "apps/$env:APP/build/windows/x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          function Get-Archive([string]$url, [string]$md5, [string]$dest) {
            if ((Test-Path $dest) -and (Get-FileHash $dest -Algorithm MD5).Hash -eq $md5) {
              Write-Host "Cache'ten: $dest"; return
            }
            for ($i = 1; $i -le 5; $i++) {
              Remove-Item $dest -Force -ErrorAction SilentlyContinue
              Write-Host "İndiriliyor ($i/5): $url"
              curl.exe -fL --retry 3 --retry-all-errors --connect-timeout 30 -o $dest $url
              $code = $LASTEXITCODE
              if ($code -eq 0 -and (Test-Path $dest) -and (Get-FileHash $dest -Algorithm MD5).Hash -eq $md5) {
                Write-Host "OK: $dest"; return
              }
              Write-Host "::warning::İndirme/MD5 başarısız (curl exit $code), tekrar denenecek."
              Start-Sleep -Seconds (15 * $i)
            }
            throw "Arşiv indirilemedi: $url"
          }

          Get-Archive $mpvUrl   $mpvMd5   (Join-Path $dir $mpvName)
          Get-Archive $angleUrl $angleMd5 (Join-Path $dir 'ANGLE.7z')

      - name: Build ${{ matrix.app }} (${{ env.FLAVOR }}${{ matrix.variant && format(' / {0}', matrix.variant) || '' }})
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          # APP_VERSION: log kayıtlarında ve log panelinde görünen sürüm.
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)"
          fi
          hw="${{ matrix.hardware }}"
          # HARDWARE: cihaz servisleri gerçek mi sahte mi (bkz. lib/core/hardware/hardware_mode.dart).
          flutter build windows --release -t lib/main_${{ env.FLAVOR }}.dart \
            --dart-define=APP_VERSION="$version" \
            ${hw:+--dart-define=HARDWARE=$hw}

      # VC++ runtime DLL'leri CMake (InstallRequiredSystemLibraries) ile exe'nin yanına
      # kopyalanır. Eksikse paket, redist kurulu olmayan makinede
      # "VCRUNTIME140_1.dll bulunamadı" hatasıyla açılmaz → build'i burada kır.
      - name: VC++ runtime DLL kontrolü
        shell: pwsh
        run: |
          $dir = "apps/${{ matrix.app }}/build/windows/x64/runner/Release"
          $missing = @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') |
            Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw "Pakette eksik VC++ runtime DLL: $($missing -join ', ')" }
          Write-Host "VC++ runtime DLL'leri pakette."

      - name: Paket adı
        id: name
        shell: bash
        run: |
          # Türkiye saati (UTC+3, yaz saati uygulaması yok) — örn. 20261109-1056
          stamp="$(date -u -d '+3 hours' +%Y%m%d-%H%M)"
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)"
          fi
          variant="${FLAVOR}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}"
          # örn. pharmed-client-20261110-1056-v0.5.0-dev-kabin-windows
          echo "zip=${{ matrix.app }}-${stamp}-${tag}-${variant}-windows" >> "$GITHUB_OUTPUT"

      - name: Zip
        run: >
          Compress-Archive
          -Path apps/${{ matrix.app }}/build/windows/x64/runner/Release/*
          -DestinationPath ${{ steps.name.outputs.zip }}.zip

      # Elle çalıştırmada: run sayfasının altındaki "Artifacts" bölümünden indirilir.
      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.zip }}
          path: ${{ steps.name.outputs.zip }}.zip
          retention-days: 14

      - name: Release'e ekle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.name.outputs.zip }}.zip

permissions:
  contents: write   # release'e dosya eklemek için

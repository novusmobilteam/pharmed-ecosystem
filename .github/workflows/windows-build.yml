# Windows build — elle tetiklenebilir + release'te otomatik.
#
# Elle: Actions → "Windows Build" → Run workflow → branch / uygulama / flavor seç.
# Release: "Publish release" edildiğinde iki uygulamayı da dev flavor ile build alıp
#          zip'leri release'e ekler (eski build-and-attach-release.yml'in yerini alır).

name: Windows Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: Hangi uygulama?
        type: choice
        options: [client, manager, both]
        default: client
      flavor:
        description: Flavor (lib/main_<flavor>.dart)
        type: choice
        options: [dev, prod, mock]
        default: dev
  release:
    types: [published]

concurrency:
  group: windows-build-${{ github.ref }}-${{ inputs.app || 'release' }}
  cancel-in-progress: true

jobs:
  # Seçime göre build matrisini üretir (client / manager / ikisi).
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - id: pick
        shell: bash
        run: |
          case "${{ inputs.app || 'both' }}" in
            client)  echo 'apps=["pharmed-client"]' >> "$GITHUB_OUTPUT" ;;
            manager) echo 'apps=["pharmed-manager"]' >> "$GITHUB_OUTPUT" ;;
            *)       echo 'apps=["pharmed-client","pharmed-manager"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      FLAVOR: ${{ inputs.flavor || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release'te tag'in kodu, elle çalıştırmada "Run workflow"da seçilen branch.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.6
          # IEC 62304 tekrarlanabilirliği için sürümü sabitlemek isterseniz:
          # flutter-version: 3.38.4
          cache: true

      - name: Flutter sürümü
        run: flutter --version

      # pub workspace (resolution: workspace) — kökten tek seferde çözülür.
      - name: Bağımlılıklar (workspace)
        run: flutter pub get

      # *.g.dart / *.freezed.dart .gitignore'da olduğu için repoda YOK;
      # CI'da üretilmezse derleme "part file not found" ile kırılır.
      - name: Kod üretimi (build_runner)
        working-directory: packages/pharmed_data
        run: dart run build_runner build --delete-conflicting-outputs

      # media_kit_libs_windows_video, CMake aşamasında ANGLE.7z ve libmpv arşivlerini
      # GitHub release'lerinden indirip MD5 kontrolü yapar. Bu arşivleri cache'leyerek
      # her build'de yeniden indirmeyi (ve geçici ağ hatalarını) önlüyoruz.
      # actions/cache yalnızca job BAŞARILI biterse kaydeder → bozuk arşiv cache'e giremez.
      # Key pubspec.lock'a bağlı → eklenti sürümü değişince cache otomatik yenilenir.
      - name: Cache media_kit native arşivleri
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/build/windows/x64/*.7z
          key: media-kit-win-${{ matrix.app }}-${{ hashFiles('**/pubspec.lock') }}

      # Arşivleri CMake'ten ÖNCE kendimiz indirip MD5 doğruluyoruz. CMake dosya
      # zaten varsa ve MD5 tutuyorsa indirmeyi atlar. URL ve MD5'ler, kullanılan
      # eklenti sürümünün kendi CMakeLists.txt'inden okunur → sürüm değişince
      # bu adımı güncellemek gerekmez. curl retry + net hata mesajı (HTTP kodu) verir.
      - name: media_kit arşivlerini önceden indir
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
        run: |
          $cfg = Get-Content .dart_tool/package_config.json -Raw | ConvertFrom-Json
          $pkg = $cfg.packages | Where-Object name -eq 'media_kit_libs_windows_video'
          if (-not $pkg) { Write-Host 'media_kit_libs_windows_video yok, atlanıyor.'; exit 0 }
          $root = $pkg.rootUri
          if ($root -match '^file:') { $root = ([Uri]$root).LocalPath }
          else { $root = Join-Path (Resolve-Path .dart_tool) $root }
          $cmake = Get-Content (Join-Path $root 'windows/CMakeLists.txt') -Raw
          Write-Host "Eklenti: $root"

          $mpv      = [regex]::Match($cmake, 'set\(LIBMPV "(mpv-dev-x86_64[^"]+)"\)')
          $mpvName  = $mpv.Groups[1].Value
          $mpvMd5   = [regex]::Match($cmake.Substring($mpv.Index), 'set\(LIBMPV_MD5 "([0-9a-fA-F]{32})"\)').Groups[1].Value
          $mpvUrl   = [regex]::Match($cmake, 'set\(LIBMPV_URL "([^"]+)"\)').Groups[1].Value.Replace('${LIBMPV}', $mpvName)
          $angleUrl = [regex]::Match($cmake, 'set\(ANGLE_URL "([^"]+)"\)').Groups[1].Value
          $angleMd5 = [regex]::Match($cmake, 'set\(ANGLE_MD5 "([0-9a-fA-F]{32})"\)').Groups[1].Value
          if (-not ($mpvName -and $mpvMd5 -and $mpvUrl -and $angleUrl -and $angleMd5)) {
            throw 'CMakeLists.txt ayrıştırılamadı (eklenti yapısı değişmiş olabilir).'
          }

          $dir = "apps/$env:APP/build/windows/x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          function Get-Archive([string]$url, [string]$md5, [string]$dest) {
            if ((Test-Path $dest) -and (Get-FileHash $dest -Algorithm MD5).Hash -eq $md5) {
              Write-Host "Cache'ten: $dest"; return
            }
            for ($i = 1; $i -le 5; $i++) {
              Remove-Item $dest -Force -ErrorAction SilentlyContinue
              Write-Host "İndiriliyor ($i/5): $url"
              curl.exe -fL --retry 3 --retry-all-errors --connect-timeout 30 -o $dest $url
              $code = $LASTEXITCODE
              if ($code -eq 0 -and (Test-Path $dest) -and (Get-FileHash $dest -Algorithm MD5).Hash -eq $md5) {
                Write-Host "OK: $dest"; return
              }
              Write-Host "::warning::İndirme/MD5 başarısız (curl exit $code), tekrar denenecek."
              Start-Sleep -Seconds (15 * $i)
            }
            throw "Arşiv indirilemedi: $url"
          }

          Get-Archive $mpvUrl   $mpvMd5   (Join-Path $dir $mpvName)
          Get-Archive $angleUrl $angleMd5 (Join-Path $dir 'ANGLE.7z')

      - name: Build ${{ matrix.app }} (${{ env.FLAVOR }})
        working-directory: apps/${{ matrix.app }}
        run: flutter build windows --release -t lib/main_${{ env.FLAVOR }}.dart

      - name: Paket adı
        id: name
        shell: bash
        run: |
          # Türkiye saati (UTC+3, yaz saati uygulaması yok) — örn. 20261109-1056
          stamp="$(date -u -d '+3 hours' +%Y%m%d-%H%M)"
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)"
          fi
          # örn. pharmed-manager-20261109-1056-dev-a896dab-dev-windows
          echo "zip=${{ matrix.app }}-${stamp}-${tag}-${FLAVOR}-windows" >> "$GITHUB_OUTPUT"

      - name: Zip
        run: >
          Compress-Archive
          -Path apps/${{ matrix.app }}/build/windows/x64/runner/Release/*
          -DestinationPath ${{ steps.name.outputs.zip }}.zip

      # Elle çalıştırmada: run sayfasının altındaki "Artifacts" bölümünden indirilir.
      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.zip }}
          path: ${{ steps.name.outputs.zip }}.zip
          retention-days: 14

      - name: Release'e ekle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.name.outputs.zip }}.zip

permissions:
  contents: write   # release'e dosya eklemek için

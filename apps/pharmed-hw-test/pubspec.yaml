name: pharmed_hw_test
description: PharMed kabin donanımı saha test uygulaması (teknisyenler için)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.9.0
  hive_flutter: ^1.1.0

  pharmed_core:
    path: ../../packages/pharmed_core
  pharmed_data:
    path: ../../packages/pharmed_data
  pharmed_hardware:
    path: ../../packages/pharmed_hardware
  pharmed_ui:
    path: ../../packages/pharmed_ui

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # pharmed_ui teması (MedTheme / MedTextStyles) bu aileleri kullanır;
  # dosyalar pharmed-client ile aynıdır.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800

    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600

    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

resolution: workspace

name: pharmed_widgetbook
description: PharMed tasarım sistemi kataloğu — tüm pharmed_ui widget'larının canlı önizlemesi.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

# NOT: Bu monorepo klasik Melos (path bağımlılıkları) kullanıyor,
# `resolution: workspace` YOK. O yüzden burada da yok.

dependencies:
  flutter:
    sdk: flutter

  # Katalog paketi — manuel yaklaşım (code-gen YOK).
  widgetbook: ^3.10.0

    # Tasarım sistemi + bağlı olduğu katmanlar
  pharmed_ui:
    path: ../../packages/pharmed_ui
  pharmed_core:
    path: ../../packages/pharmed_core
  pharmed_data:
    path: ../../packages/pharmed_data
  pharmed_utils:
    path: ../../packages/pharmed_utils

  # pharmed_core/data'nın geri bağımlı olduğu app'ler (mimari borç)
  pharmed_client:
    path: ../pharmed-client
  pharmed_manager:
    path: ../pharmed-manager

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800

    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600

    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
